name: Actualizar NOAA y publicar dashboard

on:
  push:
    branches: [main]
  schedule:
    # Dos intentos por hora (minutos 17 y 47) de 08:00 a 22:00, hora del Este,
    # de lunes a miercoles. GitHub retrasa o descarta ejecuciones programadas
    # en el minuto 0 por alta carga; el miercoles cubre feriados y descartes.
    # America/New_York ajusta automaticamente el horario estacional.
    - cron: "17,47 8-22 * * 1-3"
      timezone: "America/New_York"
    # Edicion mensual del pronostico (segundo jueves): varios intentos.
    - cron: "23 10-20/2 * * 4"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar si faltan datos semanales
        id: estado
        run: python scripts/check_pending.py >> "$GITHUB_OUTPUT"

      - name: Preparar calculo espacial
        run: python -m pip install -r requirements-spatial.txt

      - name: Reutilizar climatologia espacial
        uses: actions/cache@v4
        with:
          path: .cache/spatial/clim-1991-2020.npz
          key: oisst-climatology-sampled-v1

      - name: Descargar y procesar datos NOAA
        id: observaciones
        continue-on-error: true
        if: steps.estado.outputs.pendiente == 'true'
        run: python scripts/update_data.py

      - name: Ejecutar pruebas
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          node --test tests/analytics.test.cjs
          node --test tests/release.test.cjs
          node --test tests/ocean-map.test.cjs
          node --check app.js
          node --check monitor.js
          node --check release.js
          node --check ocean-map.js

      - name: Actualizar mapa semanal OISST
        id: mapa
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/update_spatial.py --if-due

      - name: Actualizar pronostico mensual NOAA
        id: pronostico
        continue-on-error: true
        run: python scripts/update_outlook.py --if-due

      - name: Verificar fuentes y pronostico antes de publicar
        run: python scripts/validate_data.py

      - name: Informar fuentes temporalmente no disponibles
        if: steps.observaciones.outcome == 'failure' || steps.pronostico.outcome == 'failure' || steps.mapa.outcome == 'failure'
        run: echo "::warning::Alguna fuente NOAA no pudo actualizarse. Se conserva su ultima edicion validada y su fecha visible en el dashboard."

      - name: Guardar nuevos datos si cambiaron
        id: guardado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "NOAA no publico cambios nuevos."
            echo "cambio=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: actualizar indices NOAA"
            git push
            echo "cambio=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar sitio estatico
        if: github.event_name != 'schedule' || steps.guardado.outputs.cambio == 'true'
        run: python scripts/build_site.py

      - name: Configurar GitHub Pages
        if: github.event_name != 'schedule' || steps.guardado.outputs.cambio == 'true'
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        if: github.event_name != 'schedule' || steps.guardado.outputs.cambio == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        if: github.event_name != 'schedule' || steps.guardado.outputs.cambio == 'true'
        uses: actions/deploy-pages@v4

      - name: Verificar HTML y datos en el sitio publico
        if: github.event_name != 'schedule' || steps.guardado.outputs.cambio == 'true'
        run: python scripts/verify_publication.py --url https://jp1309.github.io/el-nino-dashboard/
