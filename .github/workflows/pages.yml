name: Actualizar NOAA y publicar dashboard

on:
  push:
    branches: [main]
  schedule:
    # Tres intentos semanales en hora del Este. America/New_York ajusta
    # automaticamente el horario de verano y el horario estandar.
    - cron: "0 15 * * 1"
      timezone: "America/New_York"
    - cron: "0 18 * * 1"
      timezone: "America/New_York"
    - cron: "0 9 * * 2"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y procesar datos NOAA
        run: python scripts/update_data.py

      - name: Ejecutar pruebas
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py

      - name: Guardar nuevos datos si cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "NOAA no publico cambios nuevos."
          else
            git commit -m "data: actualizar indices NOAA"
            git push
          fi

      - name: Preparar sitio estatico
        run: |
          mkdir _site
          cp index.html styles.css app.js LICENSE _site/
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
