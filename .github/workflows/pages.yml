name: Actualizar NOAA y publicar dashboard

on:
  push:
    branches: [main]
  schedule:
    # Intentos cada hora desde las 08:00 hasta las 22:00 en hora del Este.
    # America/New_York ajusta automaticamente el horario estacional.
    - cron: "0 8-22 * * 1"
      timezone: "America/New_York"
    - cron: "0 8-22 * * 2"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Comprobar si faltan datos semanales
        id: estado
        run: python scripts/check_pending.py >> "$GITHUB_OUTPUT"

      - name: Descargar y procesar datos NOAA
        if: steps.estado.outputs.pendiente == 'true'
        run: python scripts/update_data.py

      - name: Ejecutar pruebas
        if: steps.estado.outputs.pendiente == 'true'
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py

      - name: Guardar nuevos datos si cambiaron
        id: guardado
        if: steps.estado.outputs.pendiente == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "NOAA no publico cambios nuevos."
            echo "cambio=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: actualizar indices NOAA"
            git push
            echo "cambio=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Preparar sitio estatico
        if: github.event_name != 'schedule' || steps.guardado.outputs.cambio == 'true'
        run: |
          mkdir _site
          cp index.html styles.css app.js LICENSE _site/
          cp -R data _site/data
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        if: github.event_name != 'schedule' || steps.guardado.outputs.cambio == 'true'
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        if: github.event_name != 'schedule' || steps.guardado.outputs.cambio == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar en GitHub Pages
        id: deployment
        if: github.event_name != 'schedule' || steps.guardado.outputs.cambio == 'true'
        uses: actions/deploy-pages@v4
